<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- MORNING-PAGE -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#12110d;color:#f6efe0;font-family:Inter,Arial,sans-serif}
#wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.mono{font-family:'JetBrains Mono',monospace}.serif{font-family:Fraunces,Georgia,serif}
.lab{margin:0;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.08em}
/* photo */
.ph{position:absolute;inset:-40px;background-size:cover;background-position:center;opacity:0;transition:opacity 3s ease}
.ph.on{opacity:1;animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.12) translate(-30px,-18px)}}
#shadeB{position:absolute;left:0;right:0;bottom:0;height:560px;background:#12110d;opacity:.8}
#shadeT{position:absolute;left:0;top:0;width:640px;height:270px;background:#12110d;opacity:.4}
/* top */
#hello{position:absolute;left:88px;top:60px}
#date{color:#e7d9b8;letter-spacing:.1em;font-size:18px}
#clock{margin:0;font-family:Fraunces,Georgia,serif;font-weight:300;font-size:132px;line-height:.95}
#greet{margin:8px 0 0;font-family:Fraunces,Georgia,serif;font-size:40px;line-height:1.15;max-width:900px}
#cap{position:absolute;right:88px;top:72px;text-align:right}
#cap .t{margin:0;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:26px}
#cap .s{margin:4px 0 0;color:#e7d9b8;font-size:15px}
/* cards */
#cards{position:absolute;left:88px;right:88px;top:556px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.card{border-radius:22px;padding:22px 26px;display:flex;flex-direction:column;gap:6px;min-height:212px;outline:none;transition:transform .25s ease, box-shadow .25s ease}
.card .big{margin:0;font-family:Fraunces,Georgia,serif;font-size:42px;line-height:1.02}
.card .sub{margin:0;font-size:19px;opacity:.85}
.c-surf{background:#f6efe0;color:#1d1c16}.c-surf .lab{color:#6b6553}
.c-jump{background:#2b241c}.c-jump .lab{color:#f0b48f}
.c-tide{background:#1f2a26}.c-tide .lab{color:#9fc3b2}
.c-wx{background:#2a2a1f}.c-wx .lab{color:#d4c59e}
.c-tom{background:#f6efe0;color:#1d1c16}.c-tom .lab{color:#6b6553}
.c-syd{background:#2b1f2a}.c-syd .lab{color:#d9a9cf}
.c-week{background:#2a2a1f}.c-week .lab{color:#d4c59e}
.bars{display:flex;gap:5px;margin-top:6px}.bars i{width:38px;height:7px;border-radius:4px;background:#d9ccb0}.bars i.on{background:#c46a3c}
/* strip */
#strip{position:absolute;left:88px;right:88px;top:836px;display:flex;gap:22px}
.pill{border-radius:18px;padding:14px 22px;display:flex;gap:18px;align-items:center;outline:none;transition:transform .25s ease, box-shadow .25s ease}
#weekPill{flex:1.4;background:#2a2a1f}
#playPill{flex:1;background:#2f5d47}
/* dock */
#dock{position:absolute;left:88px;right:88px;bottom:40px;display:flex;gap:14px;align-items:center}
.app{width:150px;height:70px;border-radius:12px;background:#3b3a2e;display:flex;align-items:center;justify-content:center;font-size:18px;outline:none;transition:transform .25s ease, box-shadow .25s ease}
#hint{margin-left:auto;color:#b9ae96;font-size:14px}
/* focus */
.f{cursor:pointer}
.brow.f.focus{transform:none;box-shadow:none;background:#2b241c}
.f.evrow.focus{transform:none;background:#2b241c;box-shadow:inset 0 0 0 3px #e08a4f}
.f.focus{transform:scale(1.04);box-shadow:0 0 0 5px #e08a4f, 0 0 0 11px rgba(224,138,79,.25)}
/* detail overlay */
#detail{position:absolute;inset:0;background:#12110d;display:none;padding:64px 88px;opacity:0;transition:opacity .35s ease}
#detail.open{display:block;opacity:1}
#dTitle{margin:0;font-family:Fraunces,Georgia,serif;font-size:72px;font-weight:300}
#dSub{margin:6px 0 28px;color:#b9ae96;font-size:22px}
#dBody{position:absolute;left:88px;right:88px;top:230px;bottom:64px}
#dBack{position:absolute;right:88px;top:80px;color:#b9ae96;font-size:15px}
.tbl{width:100%;border-collapse:collapse;font-size:22px}
.tbl th{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.08em;color:#8a8270;text-align:left;font-weight:400;padding:0 12px 10px 0}
.tbl td{padding:12px 12px 12px 0;border-top:1px solid #2e2d22}
.row{display:flex;gap:22px}
.box{background:#1d1c16;border-radius:18px;padding:22px 26px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px}
.day{background:#1d1c16;border-radius:16px;padding:18px 18px;min-height:150px}
.day.today{background:#2b241c;box-shadow:inset 0 0 0 2px #e08a4f}
.go{color:#9fd4a8}.marg{color:#f0c48f}.hold{color:#e58b7a}
.arrow{display:inline-block;width:22px;height:22px;vertical-align:-4px}
#radar{position:relative;width:768px;height:512px;border-radius:18px;overflow:hidden;background:#1d1c16}
#radar img{position:absolute;width:256px;height:256px}
.err{color:#e58b7a}
body.dream #cards,body.dream #strip,body.dream #dock,body.dream #detail,body.dream #shadeT{display:none!important}
body.dream #hello{opacity:.85}
.app.np{width:auto;padding:0 26px;background:#2b241c;color:#f6efe0}
</style>
</head>
<body>
<div id="wrap">
  <div id="photos"></div>
  <div id="shadeB"></div><div id="shadeT"></div>
  <div id="hello"><p class="mono" id="date" style="margin:0"></p><p id="clock"></p></div>
  <div id="cap"><p class="t" id="capT"></p><p class="s mono" id="capS"></p></div>
  <div id="cards"></div>
  <div id="strip">
    <div class="pill f" id="weekPill" data-open="week"><p class="lab" style="color:#d4c59e;flex-shrink:0">THIS WEEK</p><div id="weekLine" style="display:flex;gap:18px;font-size:18px"></div></div>
    <div class="pill f" id="playPill" data-launch="com.spotify.tv.android"><div style="width:44px;height:44px;border-radius:8px;background:#c46a3c;flex-shrink:0"></div><p style="margin:0;font-size:19px"><span class="mono" style="font-size:13px;color:#a9d4bf;display:block">PLAY ON THE TV</span><span id="playName">Morning playlist</span></p></div>
  </div>
  <div id="dock"></div>
  <div id="tone" style="position:absolute;inset:0;pointer-events:none;background:#ff9a3c;opacity:0;transition:opacity 4s"></div><div id="dimL" style="position:absolute;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity 4s"></div>
  <div id="detail"><p id="dBack" class="mono">BACK TO CLOSE</p><p id="dTitle"></p><p id="dSub"></p><div id="dBody"></div></div>
</div>
<script>
/* ---------- settings ---------- */
var CFG={
  lat:-34.40, lon:150.89, mlat:-34.42, mlon:150.95,
  updateUrl:"",               /* set in /sdcard/TV-Morning/config.json */
  calendarIcs:"",            /* paste the Google Calendar secret iCal address here */
  playlistUri:"",            /* e.g. spotify:playlist:xxxx */
  apps:[["Spotify","com.spotify.tv.android"],["YouTube","com.google.android.youtube.tv"],["Netflix","com.netflix.ninja"],["Disney+","com.disney.disneyplus"],["Max","com.wbd.stream"],["Paramount+","com.cbs.ca"],["ABC iview","au.net.abc.iview"],["SBS","com.sbs.ondemand.tv"],["9Now","au.com.ninenow.ctv"],["10","au.com.tenplay"],["7plus","com.swm.live"],["Inputs","com.tcl.tv"],["Play Store","com.android.vending"],["Settings","com.android.tv.settings"]],
  /* Time-of-day setups: applied automatically once when each one starts */
  profiles:[                 /* brightness and volume in % */
    {id:"morning",from:5, to:11,volume:20,brightness:85,dim:0,   warm:0   },
    {id:"day",    from:11,to:17,volume:25,brightness:95,dim:0,   warm:0   },
    {id:"evening",from:17,to:19,volume:15,brightness:20,dim:0.1, warm:0.12},
    {id:"night",  from:19,to:5, volume:8, brightness:0, dim:0.5, warm:0.22}],
  wakeTimes:"5:30,17:30",     /* the app brings itself to the front at these times if the TV is on */
  dockMorning:["Spotify","YouTube","Netflix","ABC iview","SBS","Disney+"],
  dockEvening:["Netflix","Disney+","Max","YouTube","SBS","Paramount+"]
};
var BREAKS=[
 {n:"Sandon Point",sw:[90,180],off:[225,315],mn:1.0,mx:3.0,tide:"lowmid",why:"Right-hander, likes S–SE and lower tide"},
 {n:"Bulli Point",sw:[100,170],off:[225,300],mn:1.0,mx:2.5,tide:"mid",why:"Point setup, best on the push to mid"},
 {n:"Thirroul",sw:[45,150],off:[225,315],mn:0.6,mx:1.8,tide:"any",why:"Beachie, picks up NE–SE swell"},
 {n:"Austinmer",sw:[45,160],off:[200,300],mn:0.5,mx:1.5,tide:"midhigh",why:"Small-day beachie, copes with a bit of SW"},
 {n:"North Wollongong",sw:[45,150],off:[180,300],mn:0.5,mx:1.8,tide:"any",why:"Tucked away from southerlies"},
 {n:"Port Kembla",sw:[45,150],off:[225,315],mn:0.6,mx:2.0,tide:"any",why:"Open beach, grabs any east in the swell"},
 {n:"Windang Island",sw:[120,200],off:[0,70],mn:1.0,mx:2.5,tide:"mid",why:"South swell spot that holds a northerly"},
 {n:"The Farm",sw:[110,190],off:[250,360],mn:0.8,mx:2.2,tide:"any",why:"Killalea, consistent on S–SE swell"}];
var HAS=typeof Native!=="undefined";
var F=null,M=null,W=null,CAL=[];

/* ---------- your settings (changed from the Customise screen, kept on the TV) ---------- */
var CARDS={surf:"Surf",jump:"Jump",tide:"Tide",weather:"Weather",events:"Events",tomorrow:"Tomorrow"};
var GENRES=["House","Deep House","Disco","Garage","Minimal","Tech House","Techno","Electro","Jazz","Bass","Hip-Hop","R&B"];
var PDEF={cards:{morning:["surf","jump","tide","weather"],day:["weather","surf","tide","jump"],evening:["tomorrow","events","weather","tide"]},
 breaksOff:[],taste:["House","Deep House","Disco","Garage","Minimal","Tech House","Electro","Jazz"],prof:{},wake:["5:30","17:30"]};
var PREFS=JSON.parse(JSON.stringify(PDEF));
function loadPrefs(){try{var p=JSON.parse(localStorage.getItem("prefs")||"{}");for(var k in p)PREFS[k]=p[k]}catch(e){}applyPrefs()}
function savePrefs(){try{localStorage.setItem("prefs",JSON.stringify(PREFS))}catch(e){}applyPrefs()}
function applyPrefs(){TASTE=PREFS.taste.map(function(x){return x.toLowerCase()});
 CFG.profiles.forEach(function(p){var o=PREFS.prof[p.id];if(o){if(o.volume!=null)p.volume=o.volume;if(o.brightness!=null)p.brightness=o.brightness}});
 CFG.wakeTimes=PREFS.wake.join(",");if(HAS&&Native.schedule)Native.schedule(CFG.wakeTimes)}
function activeBreaks(){return BREAKS.filter(function(b){return PREFS.breaksOff.indexOf(b.n)<0})}
/* ---------- helpers ---------- */
function $(i){return document.getElementById(i)}
function inR(a,r){return r[0]<=r[1]?(a>=r[0]&&a<=r[1]):(a>=r[0]||a<=r[1])}
function dist(a,r){if(inR(a,r))return 0;var d1=Math.abs(((a-r[0]+540)%360)-180),d2=Math.abs(((a-r[1]+540)%360)-180);return Math.min(d1,d2)}
function card(d){return["N","NE","E","SE","S","SW","W","NW"][Math.round(d/45)%8]}
function hh(i){var h=((i%24)+24)%24;return(h===0?12:h>12?h-12:h)+(h<12?"am":"pm")}
function hm(s){var d=new Date(s);return d.getHours()+":"+pad(d.getMinutes())}
function pad(n){return(n<10?"0":"")+n}
function arrow(deg,col){return '<svg class="arrow" viewBox="0 0 24 24" style="transform:rotate('+((deg+180)%360)+'deg)"><path d="M12 3v16M6 13l6 6 6-6" fill="none" stroke="'+(col||"currentColor")+'" stroke-width="2.4"/></svg>'}
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function nowH(){return new Date().getHours()}
function profile(){var h=nowH();for(var i=0;i<CFG.profiles.length;i++){var p=CFG.profiles[i];if(p.from<p.to?(h>=p.from&&h<p.to):(h>=p.from||h<p.to))return p}return CFG.profiles[0]}
function mode(){var id=profile().id;return id=="night"?"evening":id}
function applyProfile(force){var p=profile(),last=null;try{last=localStorage.getItem("profile")}catch(e){}
 $("tone").style.opacity=p.warm;$("dimL").style.opacity=p.dim;
 if(force||last!=p.id){if(HAS){Native.setVolume(p.volume);var okB=Native.setBrightness(Math.round(p.brightness*2.55));stat("bright",okB,okB?"set to "+p.brightness+"% (check the screen actually changed)":"TV refused the change")}try{localStorage.setItem("profile",p.id)}catch(e){}}}
function getJSON(u){
  if(HAS){return new Promise(function(res,rej){setTimeout(function(){var t=Native.get(u);t?res(JSON.parse(t)):rej("net")},0)})}
  return fetch(u).then(function(r){return r.json()});
}


/* ---------- Port Kembla wave buoy (MHL, measured) ---------- */
var BUOY=null;
function loadBuoy(){getJSON("https://mhl.nsw.gov.au/s3/www/stations/wave/PTKMOW.json").then(function(j){
  var ks=Object.keys(j.readings).sort(),rows=ks.slice(-24).map(function(k){var r=j.readings[k];return{t:new Date(k.replace(" ","T")+"+10:00"),hs:r["1033"],dir:r["1035"],tp:r["1036"]}}).filter(function(r){return r.hs!=null});
  if(!rows.length){stat("buoy",false,"no readings");return}var L=rows[rows.length-1],age=(Date.now()-L.t)/36e5;if(age>6){BUOY=null;stat("buoy",false,"last reading "+Math.round(age)+" h old");return}stat("buoy",true,L.hs.toFixed(1)+" m measured");
  var lh=localIdx(L.t),mod=M.hourly.wave_height&&M.hourly.wave_height[lh];
  BUOY={hs:L.hs,dir:L.dir,tp:L.tp,t:L.t,idx:lh,model:mod,ratio:mod?Math.max(0.6,Math.min(1.6,L.hs/mod)):1,hist:rows.map(function(r){return r.hs})};
  if(!openView)render()}).catch(function(){BUOY=null;stat("buoy",false,"couldn't reach MHL")})}
function localIdx(d){var t0=new Date(M.hourly.time[0]);return Math.round((d-t0)/36e5)-(new Date(M.hourly.time[0]).getTimezoneOffset()-d.getTimezoneOffset())/60}
function swH(i){var v=M.hourly.swell_wave_height[i];if(!BUOY||v==null)return v;var k=i-BUOY.idx,w=k<0?1:Math.max(0,1-k/18);return v*(1+(BUOY.ratio-1)*w)}
function buoyLine(){if(!BUOY)return"";var pct=Math.round((BUOY.ratio-1)*100);return"Buoy "+BUOY.hs.toFixed(1)+" m · "+Math.round(BUOY.tp)+" s · "+card(BUOY.dir)+(BUOY.model?" · forecast said "+BUOY.model.toFixed(1)+" m"+(Math.abs(pct)>=8?" (ratings "+(pct>0?"+":"")+pct+"%)":""):"")}
function buoyBox(){if(!BUOY)return'<div class="box" style="margin-top:22px;font-size:20px;color:#8a8270">Port Kembla buoy isn\'t reporting right now, so ratings use the forecast only.</div>';
 var mx=Math.max.apply(null,BUOY.hist.concat([0.5])),bars=BUOY.hist.map(function(v){return'<div style="flex:1;height:'+Math.max(4,Math.round(v/mx*60))+'px;background:#9fc3b2;border-radius:2px"></div>'}).join("");
 return'<div class="box" style="margin-top:22px;display:flex;gap:30px;align-items:center"><div style="flex:1"><p class="lab" style="color:#8a8270">PORT KEMBLA BUOY · MEASURED '+hh(BUOY.t.getHours()).toUpperCase()+'</p><p style="font-size:26px;margin:10px 0 0">'+buoyLine()+'</p></div><div style="width:420px"><p class="lab" style="color:#8a8270;margin-bottom:8px">LAST 24 HOURS</p><div style="display:flex;gap:3px;align-items:flex-end;height:62px">'+bars+'</div></div></div>'}

/* ---------- surf log: your own ratings teach the call ---------- */
var LOGW=["Flat","Poor","OK","Good","Pumping"];
function surfLog(){try{return JSON.parse(localStorage.getItem("surflog")||"[]")}catch(e){return[]}}
function logSession(v){var k=v.split("|"),bn=k[0],r=+k[1],B=BREAKS.filter(function(x){return x.n==bn})[0],h=Math.max(nowH(),5),tn=tideNorm(M.hourly),pred=score(B,h,tn),H=F.hourly;
 var L=surfLog().filter(function(x){return!(x.d==new Date().toDateString()&&x.b==bn)});
 L.push({d:new Date().toDateString(),b:bn,r:r,pred:+pred.toFixed(2),swell:+swH(h).toFixed(1),dir:Math.round(M.hourly.swell_wave_direction[h]),wind:Math.round(H.wind_speed_10m[h]),wdir:Math.round(H.wind_direction_10m[h]),buoy:BUOY?BUOY.hs:null});
 try{localStorage.setItem("surflog",JSON.stringify(L.slice(-200)))}catch(e){}
 var mine=L.filter(function(x){return x.b==bn}).slice(-8),BI=bias();
 if(mine.length){var sum=0,n=0;mine.forEach(function(x){if(x.pred>0.05){sum+=Math.max(0.1,x.r/5)/x.pred;n++}});if(n){var t=Math.max(0.6,Math.min(1.4,sum/n)),cur=BI[bn]||1;BI[bn]=+(cur+(t-cur)*0.3).toFixed(3);try{localStorage.setItem("bias",JSON.stringify(BI))}catch(e){}}}
 if(HAS)Native.log(JSON.stringify({kind:"session",entry:L[L.length-1]}));
 openDetail("break:"+bn,false);var el=$("dBody").querySelector('[data-log="'+v+'"]');if(el)setFocus(el)}
function logRow(bn){var today=surfLog().filter(function(x){return x.d==new Date().toDateString()&&x.b==bn})[0],hist=surfLog().filter(function(x){return x.b==bn&&x.d!=new Date().toDateString()}).slice(-4).reverse();
 return'<div style="display:flex;gap:14px;margin-top:22px;align-items:center"><p class="lab" style="color:#8a8270;margin-right:8px">SURFED HERE TODAY? HOW WAS IT</p>'+LOGW.map(function(w,i){var on=today&&today.r==i+1;return'<div class="app f" style="width:auto;padding:0 24px;'+(on?"background:#f6efe0;color:#1d1c16":"")+'" data-log="'+esc(bn)+'|'+(i+1)+'">'+w+'</div>'}).join("")+'</div>'+
  (hist.length?'<p class="mono" style="margin:16px 0 0;font-size:15px;color:#8a8270">YOUR LAST SESSIONS · '+hist.map(function(x){return x.d.slice(4,10).toUpperCase()+" "+LOGW[x.r-1].toUpperCase()+" ("+x.swell+"M)"}).join(" · ")+'</p>':"")}
/* ---------- scoring ---------- */
function tideNorm(MH){var sl=MH.sea_level_height_msl.slice(0,24),mn=Math.min.apply(null,sl),mx=Math.max.apply(null,sl);return MH.sea_level_height_msl.map(function(v){return(v-mn)/((mx-mn)||1)})}
function score(b,i,tn){var H=F.hourly,MH=M.hourly;
 var sz=swH(i),sd=MH.swell_wave_direction[i],ws=H.wind_speed_10m[i],wd=H.wind_direction_10m[i];
 var s=sz<b.mn?Math.max(0,1-(b.mn-sz)/b.mn):sz>b.mx?Math.max(0,1-(sz-b.mx)/b.mx):1;
 var d=Math.max(0,1-dist(sd,b.sw)/60);
 var w;if(ws<5)w=0.9;else if(inR(wd,b.off))w=ws<18?1:0.6;else{w=Math.max(0.05,1-(ws/20)*(dist(wd,b.off)/90))}
 var t=tn[i],tf=1;if(b.tide=="lowmid")tf=t<0.65?1:0.7;if(b.tide=="mid")tf=(t>0.25&&t<0.75)?1:0.7;if(b.tide=="midhigh")tf=t>0.35?1:0.7;
 var q=Math.min(1,0.45+sz/2.2);
 return s*d*w*tf*q}
function bias(){try{return JSON.parse(localStorage.getItem("bias")||"{}")}catch(e){return{}}}
function jumpLimit(){try{return +(localStorage.getItem("jumpLimit")||14)}catch(e){return 14}}
function rankBreaks(dayOff){var BI=bias();dayOff=dayOff||0;var tn=tideNorm(M.hourly),sr=new Date(F.daily.sunrise[dayOff]),fl=sr.getHours()+(sr.getMinutes()>0?1:0)+24*dayOff,last=19+24*dayOff;
 if(dayOff===0&&nowH()>fl)fl=Math.min(nowH(),last);
 var res=activeBreaks().map(function(b){var sc=[],best=0,bi=fl;for(var i=fl;i<=last;i++){var v=Math.min(1,score(b,i,tn)*(BI[b.n]||1));sc[i]=v;if(v>best){best=v;bi=i}}var s=bi,e=bi;while(s>fl&&sc[s-1]>=best*0.9&&e-s<3)s--;while(e<last&&sc[e+1]>=best*0.9&&e-s<3)e++;return{b:b,best:best,s:s,e:e}});
 return res.sort(function(a,b){return b.best-a.best})}
function jumpCall(dayOff){dayOff=dayOff||0;var H=F.hourly,o=24*dayOff,ok=[],bs=-1,bl=0,cs=-1;
 for(var i=7+o;i<=18+o;i++){var lim=jumpLimit();ok[i]=H.wind_speed_10m[i]<lim&&H.wind_gusts_10m[i]<lim+6&&cloudBase(i)>=3500&&H.precipitation_probability[i]<35}
 for(i=7+o;i<=19+o;i++){if(ok[i]){if(cs<0)cs=i;if(i-cs+1>bl){bl=i-cs+1;bs=cs}}else cs=-1}

   '<span style="width:24px"></span>'+chip("−",false,'lvl|'+p.id+'|volume|-2')+'<p style="margin:0;width:150px;text-align:center;font-size:20px">Volume '+p.volume+'%</p>'+chip("+",false,'lvl|'+p.id+'|volume|2')+'</div>'})}
 if(setSec=="phone"){var u=HAS&&Native.remoteUrl?Native.remoteUrl():"";h=note("Control the TV from your iPhone. It must be on the same Wi-Fi as the TV.")+
  (u?'<p class="lab" style="color:#8a8270;margin:26px 0 10px">OPEN THIS IN SAFARI</p><p class="mono" style="font-size:40px;margin:0;color:#f6efe0">'+esc(u.replace("http://",""))+'</p><p style="font-size:20px;color:#b9ae96;margin:26px 0 0">Then tap Share → Add to Home Screen. It opens like an app from then on.<br>The 4 digits at the end are your code. Anyone without it is refused.</p>':'<p style="font-size:22px">The TV isn\'t on Wi-Fi right now.</p>')}
 if(setSec=="system"){h=statusBody()}
 if(setSec=="wake"){h=note("The app comes to the front at these times if the TV is on. A morning time runs the sunrise wake-up.")+'<div style="display:flex;gap:12px;flex-wrap:wrap">'+["5:30","6:00","6:30","7:00","7:30","17:00","17:30","18:00"].map(function(w){return chip(w,PREFS.wake.indexOf(w)>=0,"wake|"+w)}).join("")+'</div>'+
  '<div style="margin-top:40px">'+chip("Reset everything to default",false,"reset")+'</div>'}
 return h}
function renderSettings(keep){var secs=[["phone","Phone remote"],["cards","Home cards"],["breaks","Surf breaks"],["sound","Your sound"],["light","Brightness & volume"],["wake","Wake-up"],["system","System check"]];
 $("dBody").innerHTML='<div class="row" style="align-items:flex-start"><div style="width:340px;display:flex;flex-direction:column;gap:10px">'+secs.map(function(x){return'<div class="app f" data-set="sec|'+x[0]+'" style="width:auto;justify-content:flex-start;padding:0 24px;height:64px;font-size:21px;'+(setSec==x[0]?"background:#2b241c;color:#f6efe0;box-shadow:inset 3px 0 0 #e08a4f":"")+'">'+x[1]+'</div>'}).join("")+'</div><div id="setPanel" class="box" style="flex:1;padding:30px 36px">'+setBody()+'</div></div>';
 var el=keep&&$("dBody").querySelector('[data-set="'+keep+'"]');setFocus(el||$("dBody").querySelector('[data-set="sec|'+setSec+'"]'))}
function setAction(a){var k=a.split("|"),i;
 if(k[0]=="sec"){setSec=k[1];renderSettings(a);return}
 if(k[0]=="card"){var l=PREFS.cards[k[1]]=(PREFS.cards[k[1]]||[]).slice();i=l.indexOf(k[2]);if(i>=0)l.splice(i,1);else if(l.length<4)l.push(k[2]);savePrefs();renderSettings(a);return}
 if(k[0]=="brk"){var o=PREFS.breaksOff;i=o.indexOf(k[1]);if(i>=0)o.splice(i,1);else if(BREAKS.length-o.length>1)o.push(k[1]);savePrefs();renderSettings(a);return}
 if(k[0]=="gen"){var t=PREFS.taste;i=t.indexOf(k[1]);if(i>=0)t.splice(i,1);else t.push(k[1]);savePrefs();renderSettings(a);return}
 if(k[0]=="lvl"){var p=CFG.profiles.filter(function(x){return x.id==k[1]})[0],v=Math.max(0,Math.min(100,p[k[2]]+(+k[3])));PREFS.prof[k[1]]=PREFS.prof[k[1]]||{};PREFS.prof[k[1]][k[2]]=v;savePrefs();if(profile().id==k[1])applyProfile(true);renderSettings(a);return}
 if(k[0]=="wake"){var w=PREFS.wake;i=w.indexOf(k[1]);if(i>=0)w.splice(i,1);else w.push(k[1]);w.sort(function(x,y){return(+x.replace(":",""))-(+y.replace(":",""))});savePrefs();renderSettings(a);return}
 if(k[0]=="refresh"){refresh();toast("Refreshing…");setTimeout(function(){if(openView=="settings")renderSettings(a)},4000);return}
 if(k[0]=="update"){checkUpdate();toast("Checking GitHub…");setTimeout(function(){if(openView=="settings")renderSettings(a)},5000);return}
 if(k[0]=="reset"){PREFS=JSON.parse(JSON.stringify(PDEF));try{localStorage.removeItem("bias");localStorage.removeItem("jumpLimit")}catch(e){}savePrefs();location.reload()}}

/* ---------- TV layer: what's playing and jump back in ---------- */
var NP=null,RECENT=[];
function readTV(){if(!HAS||!Native.nowPlaying)return;try{var n=Native.nowPlaying();stat("np",n!=="denied",n==="denied"?"permission not granted":"ok");NP=n&&n!=="denied"?JSON.parse(n):null}catch(e){NP=null}
 try{RECENT=(Native.recentApps()||"").split("\n").filter(Boolean).map(function(l){var k=l.split("|");return[k[1]||k[0],k[0]]})}catch(e){RECENT=[]}}
function renderPlay(){var pill=$("playPill");if(!pill)return;
 if(NP&&NP.title){pill.setAttribute("data-launch",NP.pkg);pill.querySelector(".mono").textContent=(NP.playing?"NOW PLAYING · ":"PAUSED · ")+String(NP.app||"").toUpperCase();$("playName").textContent=NP.title+(NP.artist?" · "+NP.artist:"")}
 else{pill.setAttribute("data-launch","com.spotify.tv.android");pill.querySelector(".mono").textContent="PLAY ON THE TV";$("playName").textContent="Morning playlist";if(CFG.playlistUri)pill.setAttribute("data-uri",CFG.playlistUri)}}

/* ---------- phone remote ---------- */
window.remoteCmd=function(c){var k=String(c).split(":");
 if(c=="up")move("U");else if(c=="down")move("D");else if(c=="left")move("L");else if(c=="right")move("R");
 else if(c=="ok")activate(cur);
 else if(c=="home"){if(openView)closeDetail();focusFirst()}
 else if(k[0]=="open"){openDetail(k[1])}
 else if(k[0]=="bri"||k[0]=="vol"){var p=profile(),f=k[0]=="bri"?"brightness":"volume",st=k[0]=="bri"?10:2;setAction("lvl|"+p.id+"|"+f+"|"+(k[1]=="-"?-st:st));if(openView=="settings")renderSettings();toast((f=="brightness"?"Brightness ":"Volume ")+p[f]+"%")}
 else if(c=="photo"){if(PH.length){phIdx=(phIdx+1)%PH.length;showPhoto()}}
 else if(c=="sunrise")sunrise();
 else if(c=="refresh")refresh();
 reportState()};
function reportState(){if(!HAS||!Native.reportState)return;try{var p=profile();Native.reportState(JSON.stringify({view:openView||"home",profile:p.id,brightness:p.brightness,volume:p.volume,playing:NP&&NP.title?NP.title:""}))}catch(e){}}
function toast(t){var el=$("toast");if(!el){el=document.createElement("div");el.id="toast";el.style.cssText="position:absolute;right:80px;top:60px;padding:16px 26px;border-radius:14px;background:#2b241c;color:#f6efe0;font-size:24px;transition:opacity .4s;z-index:50";$("wrap").appendChild(el)}el.textContent=t;el.style.opacity=1;clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity=0},1800)}

/* ---------- screensaver mode ---------- */
function bootDream(){document.body.className="dream";fit();clock();initPhotos();
 if(PH.length){setInterval(function(){phIdx=(phIdx+1)%PH.length;showPhoto()},60000)}
 setInterval(clock,15000)}
/* ---------- remote navigation ---------- */
var cur=null;
function focusables(){return Array.prototype.slice.call((openView?$("detail"):document).querySelectorAll(".f")).filter(function(e){return openView?true:!$("detail").contains(e)})}
function setFocus(el){if(cur)cur.classList.remove("focus");cur=el;if(el){el.classList.add("focus");if(openView=="events"){var i=el.getAttribute("data-ev");if(i!=null){evPanel(+i);el.scrollIntoView({block:"nearest"})}}}}
function focusFirst(){var l=focusables();setFocus(l[0]||null)}
function move(dir){var l=focusables();if(!cur||l.indexOf(cur)<0){focusFirst();return}var a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,H=(dir=="L"||dir=="R"),cands=[];
 l.forEach(function(e){if(e==cur)return;var b=e.getBoundingClientRect(),bx=b.left+b.width/2,by=b.top+b.height/2,dx=bx-ax,dy=by-ay;
  var ok=dir=="L"?b.right<=a.left+8:dir=="R"?b.left>=a.right-8:dir=="U"?b.bottom<=a.top+8:b.top>=a.bottom-8;if(!ok)return;
  var overlap=H?(b.top<a.bottom-4&&b.bottom>a.top+4):(b.left<a.right-4&&b.right>a.left+4);
  var main=H?Math.abs(dx):Math.abs(dy),side=H?Math.abs(dy):Math.abs(dx);cands.push({e:e,ov:overlap,d:main+side*2.5})});
 if(!cands.length)return;var ov=cands.filter(function(c){return c.ov}),pool=ov.length?ov:cands;pool.sort(function(x,y){return x.d-y.d});
 var best=pool[0].e;if(best.getAttribute("data-tab")){var act=document.querySelector('[data-tab="'+evTab+'"]');if(act&&dir=="U")best=act}
 setFocus(best)}
function activate(el){if(!el)return;var o=el.getAttribute("data-open"),p=el.getAttribute("data-launch"),fbv=el.getAttribute("data-fb");if(fbv){feedback(fbv);return}var lg=el.getAttribute("data-log");if(lg){logSession(lg);return}var bk=el.getAttribute("data-break");if(bk){openDetail("break:"+bk,true);return}var st=el.getAttribute("data-set");if(st){setAction(st);return}var tb=el.getAttribute("data-tab");if(tb){evTab=tb;evAll=false;renderEvents();return}var mo=el.getAttribute("data-more");if(mo!=null){evAll=mo=="1";renderEvents();return}
 if(o){openDetail(o);return}
 if(p){if(p=="com.spotify.tv.android"&&el.id=="playPill"&&CFG.playlistUri&&HAS&&!(NP&&NP.title)){if(Native.openUri(CFG.playlistUri,p))return}if(HAS)Native.launch(p)}}
document.addEventListener("keydown",function(e){var k=e.keyCode;
 if(k==37){move("L");e.preventDefault()}else if(k==39){move("R");e.preventDefault()}else if(k==38){move("U");e.preventDefault()}else if(k==40){move("D");e.preventDefault()}
 else if(k==13||k==23){activate(cur);e.preventDefault()}});
document.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".f"):null;if(t){setFocus(t);activate(t)}});
window.onBackKey=function(){if(openView){if(viewStack.length){openDetail(viewStack.pop(),false);return true}closeDetail();return true}return false};
window.onResumeApp=function(){refresh();if(!openView)renderDock()};
setInterval(function(){if(!openView&&document.body.className!="dream"){var c=cur&&cur.parentNode&&cur.parentNode.id=="dock"?Array.prototype.indexOf.call($("dock").children,cur):-1;renderDock();if(c>=0)setFocus($("dock").children[Math.min(c,$("dock").children.length-1)])}},60000);

/* ---------- load ---------- */
function fit(){var k=Math.min(window.innerWidth/1920,window.innerHeight/1080);$("wrap").style.transform="scale("+k+")"}
function render(){applyProfile(false);clock();renderCards();renderDock();renderWeekLine();if(!openView)focusFirst()}
function refresh(){
 var f="https://api.open-meteo.com/v1/forecast?latitude="+CFG.lat+"&longitude="+CFG.lon+"&hourly=temperature_2m,dew_point_2m,cloud_cover_low,precipitation_probability,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,cloud_cover,wind_speed_900hPa,wind_direction_900hPa,wind_speed_700hPa,wind_direction_700hPa,wind_speed_600hPa,wind_direction_600hPa&daily=sunrise,sunset,temperature_2m_max,uv_index_max&wind_speed_unit=kn&timezone=Australia%2FSydney&forecast_days=7";
 var m="https://marine-api.open-meteo.com/v1/marine?latitude="+CFG.mlat+"&longitude="+CFG.mlon+"&hourly=wave_height,swell_wave_height,swell_wave_direction,swell_wave_period,sea_surface_temperature,sea_level_height_msl&daily=swell_wave_height_max,swell_wave_direction_dominant,swell_wave_period_max&timezone=Australia%2FSydney&forecast_days=7";
 Promise.all([getJSON(f),getJSON(m)]).then(function(x){F=x[0];M=x[1];W=x[1];OFFLINE=0;saveCache();stat("wx",true,"Open-Meteo");stat("marine",true,"Open-Meteo marine");try{loadBuoy()}catch(e){}try{loadCal()}catch(e){}if((PREFS.cards[mode()]||[]).indexOf("events")>=0){try{loadEvents()}catch(e){}}if(!openView)render()}).catch(function(){stat("wx",false,"couldn't reach Open-Meteo");if(!F&&useCache()){stat("wx",false,"offline, using saved forecast");if(!openView)render();setTimeout(function(){toast("No internet · forecast saved at "+new Date(OFFLINE).toTimeString().slice(0,5))},800);return}if(F&&OFFLINE)toast("Still offline · forecast from "+new Date(OFFLINE).toTimeString().slice(0,5));if(F)return;$("cards").innerHTML='<p class="err" style="font-size:28px">Forecast didn\'t load. Check the Wi-Fi.</p>'})}
function loadConfig(){if(!HAS)return;try{var c=JSON.parse(Native.readText("/sdcard/TV-Morning/config.json")||"{}");for(var k in c)CFG[k]=c[k]}catch(e){}}
function checkUpdate(){if(!HAS||!CFG.updateUrl){stat("update",null,"no update link");return}setTimeout(function(){var r=Native.checkUpdate(CFG.updateUrl);stat("update",r!="fail",r=="same"?"up to date":r=="updated"?"new page installed":"couldn't reach GitHub");if(r=="updated")Native.reload()},3000)}
function sunrise(){var p=profile(),steps=40,k=0;$("dimL").style.transition="none";$("dimL").style.opacity=0.85;if(HAS){Native.setVolume(3);Native.setBrightness(25)}
 var t=setInterval(function(){k++;var f=k/steps;$("dimL").style.opacity=(0.85-(0.85-p.dim)*f).toFixed(3);if(HAS){Native.setVolume(Math.round(3+(p.volume-3)*f));Native.setBrightness(Math.round((10+(p.brightness-10)*f)*2.55))}if(k>=steps){clearInterval(t);$("dimL").style.transition="opacity 4s"}},15000)}
window.onWake=function(){if(openView)closeDetail();refresh();if(new Date().getHours()<11)sunrise();else applyProfile(true)};
if(location.hash=="#dream"||(HAS&&Native.dream&&Native.dream())){loadConfig();bootDream();throw"dream"}
loadConfig();loadPrefs();fit();window.addEventListener("resize",fit);clock();initPhotos();renderDock();focusFirst();refresh();checkUpdate();setInterval(checkUpdate,1800000);if(HAS&&Native.wokeByAlarm())setTimeout(sunrise,1500);
setInterval(function(){clock();var id=profile().id;if(id!=window._pid){window._pid=id;if(!openView&&F)render()}},15000);if(HAS)Native.schedule(CFG.wakeTimes);applyProfile(false);setInterval(function(){if(!openView)refresh()},900000);
</script>
